name: Nächtliche Prognose

on:
  schedule:
    - cron: "17 4 * * *"     # jeden Tag 04:17 UTC = 05:17 Schweizer Winterzeit
  workflow_dispatch:          # zusätzlich: von Hand startbar

permissions:
  contents: write             # darf neue Daten committen

jobs:
  prognose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install pandas scikit-learn requests tzdata

      - name: ① Neue Ist-Daten sammeln
        env:
          OTD_TOKEN: ${{ secrets.OTD_TOKEN }}
        run: python ml/10_sammeln.py

      - name: ② Daten aufbereiten
        run: python ml/11_aufbereiten.py

      - name: ③ Modell trainieren und Prognose erstellen
        run: python ml/09_prognose.py

      - name: ④ Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/data/linie prognosen/bus48.json
          if git diff --cached --quiet; then
            echo "Nichts Neues"
          else
            git commit -m "Nightly: new data and delay forecast"
            git push
          fi